# docker-compose.yml — Local development orchestration template
# Phase 1: Only the frontend service is active.
# Uncomment backend / game-engine / ai-service blocks when Phase 2 services are ready.

version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — Next.js application
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — Node.js / Express API (Phase 2 — currently a placeholder)
